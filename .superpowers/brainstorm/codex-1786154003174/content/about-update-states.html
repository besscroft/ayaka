<style>
  .update-preview {
    max-width: 1080px;
    margin: 0 auto;
  }
  .update-preview h2 {
    margin-bottom: 8px;
  }
  .update-preview .subtitle {
    margin-bottom: 24px;
  }
  .state-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .state-card {
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
  }
  .state-label {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.62);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .settings-mock {
    min-height: 290px;
    padding: 24px;
    background: #17191c;
    color: #f4f5f6;
  }
  .product-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }
  .app-mark {
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border-radius: 9px;
    background: #d7b58d;
    color: #231e19;
    font-weight: 700;
  }
  .muted {
    color: rgba(244, 245, 246, 0.55);
  }
  .small {
    font-size: 12px;
  }
  .version-line {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    font-size: 13px;
  }
  .update-box {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  .update-heading {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .update-copy {
    margin: 5px 0 13px;
    color: rgba(244, 245, 246, 0.56);
    font-size: 12px;
    line-height: 1.5;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #d7b58d;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }
  .mock-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .mock-button {
    border: 1px solid rgba(244, 245, 246, 0.22);
    border-radius: 6px;
    padding: 7px 10px;
    background: transparent;
    color: #f4f5f6;
    font-size: 12px;
  }
  .mock-button.primary {
    border-color: #d7b58d;
    background: #d7b58d;
    color: #231e19;
  }
  .progress {
    height: 5px;
    margin: 10px 0 14px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.12);
  }
  .progress span {
    display: block;
    width: 64%;
    height: 100%;
    background: #d7b58d;
  }
  @media (max-width: 850px) {
    .state-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="update-preview">
  <h2>设置 / 关于：更新区域</h2>
  <p class="subtitle">推荐保持版本信息、更新状态和唯一主操作在同一视觉层级内。</p>

  <div class="state-grid">
    <div class="state-card">

          </div>

        <div class="update-box">
          <div class="update-heading">
            <span>软件更新</span
            ><span class="status"><span class="status-dot"></span>已是最新</span>
          </div>
          <p class="update-copy">最近检查：刚刚</p>
          <div class="mock-actions">
            <button class="mock-button">检查更新</button>

        </div>
      </div>
    </div>

    <div class="state-card">

        <div class="update-box">
          <div class="update-heading">
            <span>软件更新</span
            ><span class="status"><span class="status-dot"></span>v0.1.4 可用</span>
          </div>
          <p class="update-copy">新版本已准备好下载，更新包来自 ai-release.zzzvoid.com。</p>
          <div class="mock-actions">
            <button class="mock-button primary">下载更新</button
            ><button class="mock-button">稍后</button>
          </div>
        </div>
      </div>
    </div>

    <div class="state-card">
      <div class="state-label">已下载待重启</div>
      <div class="settings-mock">
        <div class="product-row">
          <div class="app-mark">V</div>

          </div>
        </div>
        <div class="version-line"><span class="muted">当前版本</span><code>v0.1.3</code></div>
        <div class="update-box">
          <div class="update-heading">
            <span>软件更新</span
            ><span class="status"><span class="status-dot"></span>v0.1.4 已下载</span>
          </div>
          <p class="update-copy">关闭并重启应用后完成安装。运行中的任务不会被强制打断。</p>
          <div class="mock-actions">
            <button class="mock-button primary">重启并安装</button

          </div>
        </div>

    </div>
  </div>
</div>
